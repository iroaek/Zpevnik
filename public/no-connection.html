    <title>Zpěvník je bez připojení</title>

  <body><main><span class="mark" aria-hidden="true">♫</span><h1>Teď jste bez připojení</h1><p>Stažené písně jsou stále dostupné. Pokud tato stránka není v offline balíčku, připojte se a ve zpěvníku otevřete „Offline obsah“.</p><a href="./">Zpět do zpěvníku</a></main></body>
