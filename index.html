<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#7a321f" />
    <meta name="description" content="Offline český digitální zpěvník" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Zpěvník" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="canonical" href="%PUBLIC_BASE_URL%" />
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_BASE_PATH%icons/apple-touch-icon-lazec.png" />
    <style>
      html, body { margin: 0; min-height: 100%; background: #f3ecdf; }
      .boot-shell { display: grid; place-content: center; justify-items: center; min-height: 100vh; gap: 14px; color: #34251f; font: 600 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .boot-shell span { display: grid; place-items: center; width: 52px; height: 52px; color: #fff; font-size: 25px; border-radius: 16px; background: #7a321f; box-shadow: 0 14px 36px rgba(72,40,25,.18); }
      @media (prefers-color-scheme: dark) { html, body { background: #171310; } .boot-shell { color: #fff4df; } .boot-shell span { background: #ef9a71; } }
    </style>
    <title>Český digitální zpěvník</title>
  </head>

    <a class="skip-link" href="#main-content">Přeskočit na obsah</a>
    <div id="root"><main class="boot-shell" aria-label="Načítání aplikace"><span aria-hidden="true">♫</span><p>Otevírám zpěvník…</p></main></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
